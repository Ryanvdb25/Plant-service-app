<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plant Service</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.sub{font-size:13px;color:#cbd5e1}
main{max-width:760px;margin:auto;padding:16px 16px 100px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
h1,h2,h3,h4,p{margin:0 0 8px}.small{font-size:13px;color:#6b7280}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px;border-radius:14px;background:#f8fafc;cursor:pointer}.stat b{font-size:25px;display:block}
input,textarea,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;margin:6px 0 12px}textarea{min-height:110px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;margin:5px 0;font-size:16px;font-weight:800}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}
.result{padding:14px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0;cursor:pointer}.result:active,.stat:active{background:#eef2ff}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#ffedd5;color:#9a3412}.done{background:#dcfce7;color:#166534}.declined{background:#e5e7eb;color:#374151}.urgent{background:#fee2e2;color:#991b1b}
.link{color:#2563eb;font-weight:800}.notice{padding:12px;background:#eff6ff;border-radius:12px;margin:8px 0}.contact{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:11px 0}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);z-index:10;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px}.nav button{border:0;background:#fff;padding:8px 4px;font-weight:800;font-size:14px;min-height:62px;border-radius:12px;color:#374151;line-height:1.2}.nav button.active{background:#eef2ff;color:#111827}.nav button:active{background:#e5e7eb}
.pdf{background:#f8fafc;padding:12px;border-radius:12px;margin:8px 0}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{background:#f3f4f6;padding:16px;text-align:center;border-radius:10px;font-size:12px}.hidden{display:none}.draft-delete{border:0;background:#fee2e2;color:#991b1b;border-radius:10px;padding:8px 11px;font-weight:800}.photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.photo-action{display:flex;align-items:center;justify-content:center;text-align:center;background:#e5e7eb;border-radius:12px;padding:14px 10px;font-weight:800;min-height:54px;cursor:pointer}.overdue{background:#fee2e2;color:#991b1b}.status-log{border-left:3px solid #d1d5db;padding-left:12px;margin:10px 0}.mini{font-size:12px;color:#6b7280}
</style>
</head>
<body>
<header><div class="row"><div><h1>Plant Service</h1><div class="sub" id="roleText">Technician • Test Version 1.6</div></div><button id="roleBtn" onclick="toggleRole()" style="border:0;border-radius:10px;padding:9px 11px;font-weight:800">Forman View</button></div></header>
<main id="app"></main>
<nav class="nav"><button id="navHome" onclick="home()">🏠<br>Home</button><button id="navCustomers" onclick="customers()">👤<br>Customers</button><button id="navDefects" onclick="defects('open')">🔧<br>Defects</button></nav>

<script>
const KEY="plant_service_v12";
let db={
customers:[
{id:1,name:"ABC Civil",contacts:[{name:"John Smith",role:"Fleet Manager",phone:"+6421555010"},{name:"Sarah Jones",role:"Service Manager",phone:"+6421555011"}]},
{id:2,name:"Smith Contracting",contacts:[{name:"Mike Brown",role:"Site Manager",phone:"+6421555022"}]}
],
machines:[
{id:1,customer:1,model:"L260",serial:"4011",fleet:"50001"},
{id:2,customer:1,model:"A40G",serial:"5120",fleet:"50022"},
{id:3,customer:2,model:"EC750",serial:"7821",fleet:"50114"}
],
defects:[
{id:"DEF-001",machine:1,title:"Hydraulic hose leaking",desc:"LH hydraulic hose showing active leak.",status:"Waiting for Parts",urgency:"High",tech:"Ryan",date:"12 Aug 2026",pdf:"Parts list.pdf",note:"Hose and fittings required",photos:[]},
{id:"DEF-002",machine:1,title:"Engine oil leak",desc:"Oil leak found around engine area.",status:"Completed",urgency:"Medium",tech:"Dave",date:"21 Jun 2026",pdf:"Service report.pdf",note:"Repair completed",photos:[]},
{id:"DEF-003",machine:3,title:"Bucket linkage wear",desc:"Excessive wear found at bucket linkage.",status:"Completed",urgency:"Low",tech:"Mike",date:"02 Jul 2026",pdf:"Inspection.pdf",note:"Bushes replaced",photos:[]},
{id:"DEF-004",machine:3,title:"Hydraulic pressure low",desc:"Pressure below expected range.",status:"New",urgency:"Urgent",tech:"Ryan",date:"12 Aug 2026",pdf:"",note:"",photos:[]}
],
drafts:[]
};
try{let x=JSON.parse(localStorage.getItem(KEY)||"null");if(x)db=x}catch(e){}
if(!db.role)db.role="Technician";
db.defects.forEach(function(d){
 if(!d.lastAction)d.lastAction=d.date||"12 Aug 2026";
 if(!d.statusHistory)d.statusHistory=[{date:d.date||"12 Aug 2026",status:d.status,by:d.tech||"Unknown"}];
 if(!d.assignedTech)d.assignedTech=d.tech||"Unassigned";
});
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function C(id){return db.customers.find(x=>x.id==id)}
function M(id){return db.machines.find(x=>x.id==id)}
function D(id){return db.defects.find(x=>x.id==id)}
function closed(d){return d.status==="Completed"||d.status==="Customer didn't go ahead"}
function badge(s){let cl=s==="Completed"?"done":s==="Customer didn't go ahead"?"declined":s==="Urgent"?"urgent":"";return `<span class="tag ${cl}">${esc(s)}</span>`}
function openList(){return db.defects.filter(d=>!closed(d))}
function isForman(){return db.role==="Forman"}
function daysOld(d){
 let t=Date.parse(d.lastAction);
 if(isNaN(t))return 0;
 return Math.floor((new Date("2026-08-12T18:22:00").getTime()-t)/86400000);
}
function isOverdue(d){return !closed(d)&&daysOld(d)>=14}
function toggleRole(){db.role=isForman()?"Technician":"Forman";save();syncRole();home()}
function syncRole(){
 let t=document.getElementById("roleText"),b=document.getElementById("roleBtn");
 if(t)t.textContent=db.role+" • Test Version 1.6";
 if(b)b.textContent=isForman()?"Technician View":"Forman View";
}
function activeNav(name){
 ["navHome","navCustomers","navDefects"].forEach(function(id){let b=document.getElementById(id);if(b)b.classList.remove("active")});
 let b=document.getElementById(name);if(b)b.classList.add("active");
}

function home(){
activeNav("navHome");syncRole();
let open=openList();
if(isForman()){
 let newD=open.filter(d=>d.status==="New"), urgent=open.filter(d=>d.urgency==="Urgent"), waiting=open.filter(d=>d.status==="Waiting for Customer Approval"), parts=open.filter(d=>d.status==="Waiting for Parts"), overdue=open.filter(isOverdue);
 app.innerHTML=`<div class="card"><h2>Forman Dashboard</h2><p class="small">Defects needing service-team action.</p>
 <button class="btn primary" onclick="report()">＋ ADD DEFECT</button>
 <div class="grid">
 <div class="stat" onclick="formanFilter('New')"><b>${newD.length}</b>New</div>
 <div class="stat" onclick="formanFilter('Urgent')"><b>${urgent.length}</b>Urgent</div>
 <div class="stat" onclick="formanFilter('Waiting for Customer Approval')"><b>${waiting.length}</b>Waiting customer</div>
 <div class="stat" onclick="formanFilter('Waiting for Parts')"><b>${parts.length}</b>Waiting parts</div>
 <div class="stat overdue" onclick="formanFilter('Overdue')"><b>${overdue.length}</b>Overdue 14+ days</div>
 <div class="stat" onclick="defects('open')"><b>${open.length}</b>All open</div>
 </div></div>
 <div class="card"><h3>Needs attention</h3>${open.slice().sort((a,b)=>(isOverdue(b)?1:0)-(isOverdue(a)?1:0)).map(defectCard).join("")||"<p class='small'>Nothing open.</p>"}</div>`;
 return;
}
app.innerHTML=`<div class="card"><h2>Good afternoon</h2><p class="small">Technician view</p><button class="btn primary" onclick="report()">＋ REPORT DEFECT</button><div class="grid"><div class="stat" onclick="defects('open')"><b>${open.length}</b>Open defects<br><span class="link">Tap to view →</span></div><div class="stat" onclick="defects('history')"><b>${db.defects.length}</b>History records<br><span class="link">Tap to view →</span></div></div></div>
${db.drafts.length?`<div class="card"><h3>📝 Drafts</h3>${db.drafts.map(d=>`<div class="result" onclick="resume('${d.id}')"><div class="row"><b>${esc(d.title||"Untitled defect")}</b><button class="draft-delete" onclick="event.stopPropagation();deleteDraft('${d.id}')">Delete</button></div><p class="small">${d.machine?M(d.machine)?.model+" • S/N "+M(d.machine)?.serial:"Equipment not selected"}</p><span class="link">Continue →</span></div>`).join("")}</div>`:""}
<div class="card"><h3>Recent defects</h3>${db.defects.slice(0,3).map(defectCard).join("")}</div>`;
}
function formanFilter(type){
 activeNav("navDefects");
 let list=openList().filter(function(d){
  if(type==="Urgent")return d.urgency==="Urgent";
  if(type==="Overdue")return isOverdue(d);
  return d.status===type;
 });
 app.innerHTML=`<button class="btn secondary" onclick="home()">← Dashboard</button><div class="card"><h2>${esc(type)}</h2><div>${list.length?list.map(defectCard).join(""):"<p class='small'>No matching defects.</p>"}</div></div>`;
}
function defectCard(d,n=""){
let m=M(d.machine),c=C(m.customer);
return `<div class="result" onclick="viewDefect('${esc(d.id)}')"><div class="row"><b>${n?`#${n} `:""}${esc(d.title)}</b>${badge(d.status)}</div><p class="small">${esc(c.name)} • ${esc(m.model)} • S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><p class="small">${esc(d.date)} • ${esc(d.tech)}${isForman()?" • Assigned: "+esc(d.assignedTech):""}</p>${isOverdue(d)?'<span class="tag overdue">OVERDUE 14+ DAYS</span><br>':""}<span class="link">View defect →</span></div>`
}

function customers(){
activeNav("navCustomers");
let sortedCustomers=[...db.customers].sort((a,b)=>a.name.localeCompare(b.name));
app.innerHTML=`<div class="card"><h2>Customers & Equipment</h2><button class="btn primary" onclick="addCustomer()">＋ ADD CUSTOMER</button><p class="small">Search customer, model, S/N or F/N.</p><input id="cq" placeholder="Try EC750, 4011, 50001 or ABC Civil" oninput="customerFilter(this.value)"><div id="cr">${sortedCustomers.map(c=>customerCard(c)).join("")}</div></div>`
}
function customerCard(c){return `<div class="result" onclick="customerView(${c.id})"><h3>${esc(c.name)}</h3><p class="small">${db.machines.filter(m=>m.customer==c.id).length} machines • ${c.contacts.length} contacts</p></div>`}
function machineResult(m){let c=C(m.customer);return `<div class="result" onclick="machineView(${m.id})"><b>${esc(c.name)}</b><p><b>${esc(m.model)}</b> • S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><span class="link">Open machine →</span></div>`}
function customerFilter(q){q=q.trim().toLowerCase();let ms=db.machines.filter(m=>{let c=C(m.customer);return [c.name,m.model,m.serial,m.fleet].join(" ").toLowerCase().includes(q)});cr.innerHTML=q?(ms.length?ms.map(machineResult).join(""):"<p class='small'>No results.</p>"):[...db.customers].sort((a,b)=>a.name.localeCompare(b.name)).map(customerCard).join("")}
function customerView(id){let c=C(id),ms=db.machines.filter(m=>m.customer==id);app.innerHTML=`<button class="btn secondary" onclick="customers()">← Customers</button><div class="card"><h2>${esc(c.name)}</h2><h3>📞 Contacts</h3>${c.contacts.map(x=>`<div class="contact"><div><b>${esc(x.name)}</b><div class="small">${esc(x.role)}<br>${esc(x.phone)}</div></div><a class="link" href="tel:${esc(x.phone)}">CALL</a></div>`).join("")}</div><div class="card"><h3>🚜 Equipment</h3><button class="btn primary" onclick="addEquipment(${c.id})">＋ ADD EQUIPMENT</button>${ms.length?ms.map(machineResult).join(""):"<p class='small'>No equipment added yet.</p>"}</div>`}

function addCustomer(){
 app.innerHTML=`<button class="btn secondary" onclick="customers()">← Back</button><div class="card"><h2>Add Customer</h2>
 <label><b>Customer name</b></label><input id="newCustomerName" placeholder="e.g. ABC Civil">
 <label><b>Primary contact name</b></label><input id="newContactName" placeholder="e.g. John Smith">
 <label><b>Contact role</b></label><input id="newContactRole" placeholder="e.g. Fleet Manager">
 <label><b>Phone</b></label><input id="newContactPhone" placeholder="e.g. +64 21 555 010">
 <button class="btn primary" onclick="saveCustomer()">SAVE CUSTOMER</button></div>`;
}
function saveCustomer(){
 let name=document.getElementById("newCustomerName").value.trim();
 if(!name){alert("Please enter a customer name.");return}
 let id=db.customers.length?Math.max.apply(null,db.customers.map(c=>c.id))+1:1;
 let contactName=document.getElementById("newContactName").value.trim();
 let contacts=[];
 if(contactName){
   contacts.push({
     name:contactName,
     role:document.getElementById("newContactRole").value.trim()||"Contact",
     phone:document.getElementById("newContactPhone").value.trim()
   });
 }
 db.customers.push({id:id,name:name,contacts:contacts});
 save(); customerView(id);
}
function addEquipment(customerId){
 let c=C(customerId);
 app.innerHTML=`<button class="btn secondary" onclick="customerView(${customerId})">← Back</button><div class="card"><h2>Add Equipment</h2><p class="small">${esc(c.name)}</p>
 <label><b>Model</b></label><input id="newModel" placeholder="e.g. L260">
 <label><b>Serial number (S/N)</b></label><input id="newSerial" placeholder="e.g. 4011">
 <label><b>Fleet number (F/N)</b></label><input id="newFleet" placeholder="e.g. 50001">
 <button class="btn primary" onclick="saveEquipment(${customerId})">SAVE EQUIPMENT</button></div>`;
}
function saveEquipment(customerId){
 let model=document.getElementById("newModel").value.trim();
 let serial=document.getElementById("newSerial").value.trim();
 let fleet=document.getElementById("newFleet").value.trim();
 if(!model){alert("Please enter the machine model.");return}
 let id=db.machines.length?Math.max.apply(null,db.machines.map(m=>m.id))+1:1;
 db.machines.push({id:id,customer:customerId,model:model,serial:serial,fleet:fleet});
 save(); machineView(id);
}
function machineView(id){let m=M(id),c=C(m.customer),ds=db.defects.filter(d=>d.machine==id);app.innerHTML=`<button class="btn secondary" onclick="customerView(${c.id})">← ${esc(c.name)}</button><div class="card"><h2>${esc(m.model)}</h2><p>${esc(c.name)}</p><p>S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><h3>📞 Contacts</h3>${c.contacts.map(x=>`<div class="contact"><b>${esc(x.name)}<div class="small">${esc(x.role)}</div></b><a class="link" href="tel:${esc(x.phone)}">CALL</a></div>`).join("")}<button class="btn primary" onclick="report(${m.id})">${isForman()?"＋ ADD DEFECT":"＋ REPORT DEFECT"}</button></div><div class="card"><h3>📚 Defect / Job History (${ds.length})</h3>${ds.length?ds.map((d,i)=>defectCard(d,i+1)).join(""):"<p class='small'>No history.</p>"}</div>`}

function defects(view){
activeNav("navDefects");
let list=view==="history"?db.defects:openList();
app.innerHTML=`<div class="card"><h2>${view==="history"?"All Defect History":"Open Defects"} (${list.length})</h2><p class="small">Universal search. Only matching results are shown.</p><input id="dq" placeholder="Customer, model, S/N, F/N, defect, title, description..." oninput="defectFilter(this.value,'${view}')"><div id="dr">${view==="history"?list.map((d,i)=>defectCard(d,i+1)).join(""):list.map(d=>defectCard(d)).join("")||"<p class='small'>No defects.</p>"}</div></div>`;
}
function defectFilter(q,view){
q=q.trim().toLowerCase();let list=view==="history"?db.defects:openList();
if(q)list=db.defects.filter(d=>{let m=M(d.machine),c=C(m.customer);return [d.id,d.title,d.desc,d.status,d.urgency,d.tech,c.name,m.model,m.serial,m.fleet].join(" ").toLowerCase().includes(q)});
dr.innerHTML=list.length?(view==="history"?list.map((d,i)=>defectCard(d,i+1)).join(""):list.map(d=>defectCard(d)).join("")):`<p class="small">No results for “${esc(q)}”.</p>`
}

function equipmentMatches(q){q=q.trim().toLowerCase();return db.machines.filter(m=>{let c=C(m.customer);return [c.name,m.model,m.serial,m.fleet].join(" ").toLowerCase().includes(q)})}
function report(machineId=""){
window.draftId=null;
app.innerHTML=`<button class="btn secondary" onclick="${machineId?`machineView(${machineId})`:"home()"}">← Back</button><div class="card"><h2>${isForman()?"Add Defect":"Report Defect"}</h2><p class="small">${isForman()?"Add a defect directly to the system.":"Your draft saves while you type. Submit when ready."}</p><input id="eq" placeholder="Search customer, model, S/N or F/N" oninput="equipmentSearch(this.value)"><div id="er"></div><input type="hidden" id="mid" value="${machineId}"><div id="selected">${machineId?selected(M(machineId)):""}</div><label><b>Short title</b></label><input id="title" placeholder="e.g. LH hydraulic hose leaking" oninput="draftSave()"><label><b>What did you find?</b></label><textarea id="desc" placeholder="Describe the defect..." oninput="draftSave()"></textarea><label><b>Urgency</b></label><select id="urgency" onchange="draftSave()"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select><button class="btn primary" onclick="submitDefect()">SAVE / SUBMIT DEFECT</button></div>`;
if(machineId)draftSave()
}
function selected(m){let c=C(m.customer);return `<div class="notice"><b>${esc(c.name)}</b><p>${esc(m.model)} • S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><p class="small">Customer contact available below.</p>${c.contacts.map(x=>`<div class="contact"><div><b>${esc(x.name)}</b><div class="small">${esc(x.role)}</div></div><a class="link" href="tel:${esc(x.phone)}">CALL</a></div>`).join("")}</div>`}
function equipmentSearch(q){let ms=equipmentMatches(q);er.innerHTML=q?(ms.length?ms.map(m=>`<div class="result" onclick="choose(${m.id})">${machineResult(m).replace('onclick="machineView('+m.id+')"','')}</div>`):"<p class='small'>No equipment found.</p>"):""}
function choose(id){mid.value=id;selected.innerHTML=selected(M(id));eq.value="";er.innerHTML="";draftSave()}
function draftSave(){let d={machine:mid?.value||"",title:title?.value||"",desc:desc?.value||"",urgency:urgency?.value||"Medium"};if(!d.machine&&!d.title&&!d.desc)return;let x=window.draftId?db.drafts.find(a=>a.id===window.draftId):null;if(x)Object.assign(x,d);else{d.id="DRAFT-"+Date.now();window.draftId=d.id;db.drafts.unshift(d)}save()}
function resume(id){let d=db.drafts.find(x=>x.id===id);if(!d)return;window.draftId=id;report(d.machine);setTimeout(()=>{title.value=d.title;desc.value=d.desc;urgency.value=d.urgency},0)}
function deleteDraft(id){db.drafts=db.drafts.filter(x=>x.id!==id);if(window.draftId===id)window.draftId=null;save();home()}
function submitDefect(){let m=M(mid.value);if(!m){alert("Please select equipment first.");return}let reporter=isForman()?"Forman":"Ryan";
let d={id:"DEF-"+String(500+db.defects.length+1).padStart(5,"0"),machine:m.id,title:title.value||"Untitled defect",desc:desc.value||"",status:"New",urgency:urgency.value,tech:reporter,date:"12 Aug 2026",pdf:"",note:"",photos:[]};d.lastAction="12 Aug 2026";d.assignedTech="Unassigned";d.statusHistory=[{date:"12 Aug 2026",status:"New",by:reporter,note:"Defect created"}];
db.defects.unshift(d);db.drafts=db.drafts.filter(x=>x.id!==window.draftId);window.draftId=null;save();viewDefect(d.id)}

function viewDefect(id){
 let d=D(id),m=M(d.machine),c=C(m.customer),lock=closed(d);
 let html='<button class="btn secondary" onclick="machineView('+m.id+')">← '+esc(m.model)+' history</button>';
 html+='<div class="card"><div class="row"><h2>'+esc(d.title)+'</h2>'+badge(d.status)+'</div>';
 html+='<p>'+esc(d.desc)+'</p><p class="small">'+esc(d.id)+' • '+esc(d.date)+' • '+esc(d.tech)+'</p>';
 html+='<p><b>'+esc(c.name)+'</b><br>'+esc(m.model)+' • S/N '+esc(m.serial)+' • F/N '+esc(m.fleet)+'</p>';
 html+=lock?'<div class="notice">🔒 Closed — technician editing is locked.</div>':'<button class="btn primary" onclick="editDefect(\''+d.id+'\')">✏️ EDIT / ADD INFORMATION</button>';
 html+='</div>';
 if(isForman()){
 html+='<div class="card"><h3>📌 Forman Controls</h3><label><b>Status</b></label><select id="fs"><option>New</option><option>Called Customer</option><option>Waiting for Customer Approval</option><option>Waiting for Parts</option><option>Waiting for Technician</option><option>Scheduled</option><option>In Progress</option><option>Completed</option><option>Customer didn\'t go ahead</option></select><label><b>Urgency</b></label><select id="fu"><option>Low</option><option>Medium</option><option>High</option><option>Urgent</option></select><label><b>Assigned technician</b></label><input id="fa" value="'+esc(d.assignedTech||"")+'" placeholder="Technician name"><label><b>Customer / service note</b></label><input id="fnote" placeholder="Optional note about this update"><button class="btn primary" onclick="saveFormanUpdate(\''+d.id+'\')">SAVE STATUS UPDATE</button></div>';
 setTimeout(function(){let fs=document.getElementById("fs"),fu=document.getElementById("fu");if(fs)fs.value=d.status;if(fu)fu.value=d.urgency},0);
 } else {
 html+='<div class="card"><h3>📌 Status</h3>'+badge(d.status)+'<p class="small">Status and urgency are managed by the Forman.</p><p><b>Urgency:</b> '+esc(d.urgency)+'</p></div>';
 }
 html+='<div class="card"><h3>📎 PDF</h3>';
 if(!lock) html+='<input type="file" accept="application/pdf" onchange="attachPDF(\''+d.id+'\',this)">';
 html+=d.pdf?'<div class="pdf">📄 <b>'+esc(d.pdf)+'</b><br><span class="small">'+esc(d.note||'')+'</span></div>':'<p class="small">No PDF attached.</p>';
 if(!lock) html+='<input placeholder="One note beside PDF" value="'+esc(d.note||'')+'" onchange="noteSave(\''+d.id+'\',this.value)">';
 html+='</div>';
 html+='<div class="card"><h3>📷 Photos ('+d.photos.length+')</h3>';
 if(lock) html+='<p class="small">Read-only because defect is closed.</p>';
 else {
   html+='<div class="photo-actions">';
   html+='<label class="photo-action">📷 Take Photo<input class="hidden" type="file" accept="image/*" capture="environment" onchange="addPhotos(\''+d.id+'\',this)"></label>';
   html+='<label class="photo-action">🖼️ Photo Library<input class="hidden" type="file" accept="image/*" multiple onchange="addPhotos(\''+d.id+'\',this)"></label>';
   html+='</div>';
 }
 html+='<div class="photos">'+d.photos.map(function(p){return '<div class="photo">📷<br>'+esc(p)+'</div>'}).join('')+'</div></div>';
 html+='<div class="card"><h3>🕘 Status History</h3>'+d.statusHistory.slice().reverse().map(function(h){return '<div class="status-log"><b>'+esc(h.status)+'</b><div class="mini">'+esc(h.date)+' • '+esc(h.by)+(h.note?' • '+esc(h.note):'')+'</div></div>'}).join('')+'</div>';
 app.innerHTML=html;
}
function saveFormanUpdate(id){
 let d=D(id);if(!isForman())return viewDefect(id);
 let old=d.status,newStatus=document.getElementById("fs").value;
 d.status=newStatus;d.urgency=document.getElementById("fu").value;d.assignedTech=document.getElementById("fa").value.trim()||"Unassigned";
 let note=document.getElementById("fnote").value.trim();
 d.lastAction="12 Aug 2026";
 d.statusHistory.push({date:"12 Aug 2026",status:newStatus,by:"Forman",note:note});
 save();viewDefect(id);
}
function editDefect(id){let d=D(id);if(closed(d))return viewDefect(id);app.innerHTML=`<button class="btn secondary" onclick="viewDefect('${id}')">← Back</button><div class="card"><h2>Edit / Add Information</h2><input id="et" value="${esc(d.title)}"><textarea id="ed">${esc(d.desc)}</textarea><p class="small">Status and urgency remain Forman-controlled.</p><button class="btn primary" onclick="editSave('${id}')">SAVE CHANGES</button></div>`}
function editSave(id){let d=D(id);if(closed(d))return viewDefect(id);d.title=et.value||d.title;d.desc=ed.value||d.desc;save();viewDefect(id)}
function attachPDF(id,input){let d=D(id);if(closed(d))return;if(input.files[0]){d.pdf=input.files[0].name;save();viewDefect(id)}}
function noteSave(id,v){let d=D(id);if(!closed(d)){d.note=v;save()}}
function addPhotos(id,input){let d=D(id);if(closed(d))return;Array.from(input.files).forEach(f=>d.photos.push(f.name));save();viewDefect(id)}

home();
</script>
</body>
</html>
