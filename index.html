<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>Plant Service</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827}
header{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
h1,h2,h3,p{margin:0 0 8px}.sub{color:#cbd5e1;font-size:14px}.wrap{max-width:720px;margin:auto;padding:16px 16px 105px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000b}.btn{width:100%;border:0;border-radius:13px;padding:15px 16px;font-weight:700;font-size:16px;margin:6px 0;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:14px;background:#f8fafc;transition:.15s}.stat:active{transform:scale(.98);background:#eef2ff}.stat b{font-size:24px;display:block}.tag{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#e5e7eb;margin:3px}.open{background:#ffedd5;color:#9a3412}.done{background:#dcfce7;color:#166534}.declined{background:#e5e7eb;color:#374151}.urgent{background:#fee2e2;color:#991b1b}
input,textarea,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;margin:6px 0 12px}textarea{min-height:110px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.link{color:#2563eb;font-weight:700;cursor:pointer}.small{font-size:13px;color:#6b7280}.photo{border:1px dashed #9ca3af;padding:18px;text-align:center;border-radius:12px;color:#6b7280}.contact{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #d1d5db;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:10}
.nav button{background:none;border:0;font-weight:800;color:#374151;font-size:16px;padding:10px 18px;min-width:30%;min-height:58px}
.nav button:first-line{font-size:21px}
.searchresult{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:13px;margin:7px 0;cursor:pointer}
.searchresult:active{background:#f3f4f6}.selected{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:14px;margin:10px 0}.history-item:active{transform:scale(.99);background:#f8fafc}.pdf{background:#f8fafc;padding:12px;border-radius:12px;margin:7px 0}
</style>
</head>
<body>
<header><h1>Plant Service</h1><div class="sub">Test prototype • Version 0.2</div></header>
<div class="wrap" id="app"></div>
<nav class="nav">
<button onclick="home()">🏠<br>Home</button>
<button onclick="customers()">👤<br>Customers</button>
<button onclick="defects()">🔧<br>Defects</button>
</nav>
<script>
let drafts=[];
let data={
 customers:[
  {id:1,name:"ABC Civil",contacts:[{name:"John Smith",role:"Fleet Manager",phone:"+64 21 555 010"},{name:"Sarah Jones",role:"Service Manager",phone:"+64 21 555 011"}],machines:[1,2]},
  {id:2,name:"Smith Contracting",contacts:[{name:"Mike Brown",role:"Site Manager",phone:"+64 21 555 022"}],machines:[3]}
 ],
 machines:[
  {id:1,customer:1,model:"L260",serial:"4011",fleet:"50001",hours:"8,421"},
  {id:2,customer:1,model:"A40G",serial:"5120",fleet:"50022",hours:"6,210"},
  {id:3,customer:2,model:"EC750",serial:"7821",fleet:"50114",hours:"9,102"}
 ],
 defects:[
  {id:"DEF-00481",machine:1,title:"LH suspension cylinder leak",desc:"Cylinder leaking heavily. Recommend inspection and reseal.",status:"Completed",urgency:"High",tech:"Dave Smith",date:"03 Aug 2026",pdf:"Parts list.pdf",note:"Seal kit + 4 O-rings required"},
  {id:"DEF-00453",machine:1,title:"Hydraulic temperature high",desc:"Hydraulic temperature running high during heavy loading.",status:"Customer didn't go ahead",urgency:"Medium",tech:"Ryan",date:"18 Jul 2026",pdf:"Job report.pdf",note:"Customer deferred repair"},
  {id:"DEF-00502",machine:1,title:"Hydraulic hose leaking",desc:"LH hydraulic hose showing active leak.",status:"Waiting for Parts",urgency:"High",tech:"Ryan",date:"12 Aug 2026",pdf:"Parts list.pdf",note:"Hose and fittings required"},
  {id:"DEF-00420",machine:2,title:"Engine oil leak",desc:"Oil leak found around engine area.",status:"Completed",urgency:"Medium",tech:"Dave Smith",date:"21 Jun 2026",pdf:"Service report.pdf",note:"Repair completed"},
  {id:"DEF-00398",machine:3,title:"Bucket linkage wear",desc:"Excessive wear found at bucket linkage.",status:"Completed",urgency:"Low",tech:"Mike",date:"02 Jul 2026",pdf:"Inspection.pdf",note:"Bushes replaced"}
 ]
};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function customer(id){return data.customers.find(x=>x.id==id)}
function machine(id){return data.machines.find(x=>x.id==id)}
function badge(s){let c=s=="Completed"?"done":s=="Customer didn't go ahead"?"declined":s=="Urgent"?"urgent":"open";return `<span class="tag ${c}">${esc(s)}</span>`}
function home(){
 let draftSection=drafts.length?`<div class="card"><h3>📝 Draft defects</h3><p class="small">Unsubmitted defects are saved so you can continue later.</p>${drafts.map(d=>`<div class="searchresult" onclick="resumeDraft('${d.id}')"><b>${esc(d.title||"Untitled defect")}</b><p class="small">${d.machine?machine(d.machine)?.model+" • S/N "+machine(d.machine)?.serial:"Equipment not selected yet"}</p><p class="link">Continue draft →</p></div>`).join("")}</div>`:"";
 app.innerHTML=`<div class="card"><h2>Good afternoon</h2><p class="small">Technician test view.</p><button class="btn primary" onclick="newDefect()">＋ REPORT DEFECT</button><div class="grid">
<div class="stat" style="cursor:pointer" onclick="defects('open')"><b>${data.defects.filter(d=>!["Completed","Customer didn't go ahead"].includes(d.status)).length}</b>Open defects<br><span class="link">Tap to view →</span></div>
<div class="stat" style="cursor:pointer" onclick="defects('history')"><b>${data.defects.length}</b>History records<br><span class="link">Tap to view →</span></div>
</div></div>${draftSection}<div class="card"><h3>Recent defects</h3>${data.defects.slice(0,3).map(defectCard).join("")}</div>`;
}
function defectCard(d,number){
 let m=machine(d.machine);
 return `<div class="card history-item" style="box-shadow:none;border:1px solid #eee;cursor:pointer" onclick="viewDefect('${d.id}')">
 <div class="row"><b>${number?`#${number} `:""}${esc(d.title)}</b>${badge(d.status)}</div>
 <p class="small">${esc(m.model)} • S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p>
 <p class="small">${esc(customer(m.customer).name)} • ${esc(d.date)} • ${esc(d.tech)}</p>
 <p class="link" style="margin-top:8px">Tap to view full defect →</p>
 </div>`;
}
function customers(){
 app.innerHTML=`<div class="card"><h2>Customers & Equipment</h2>
 <p class="small">Search by customer, machine model, S/N or F/N.</p>
 <input id="customerSearch" placeholder="Customer, model, S/N or F/N" oninput="filterCustomers(this.value)">
 <div id="custList">${customerSearchResults("")}</div></div>`;
}
function customerCard(c){
 return `<div class="card" style="box-shadow:none;border:1px solid #eee" onclick="viewCustomer(${c.id})"><h3>${esc(c.name)}</h3><p class="small">${c.machines.length} machines • ${c.contacts.length} contacts</p></div>`;
}
function machineSearchCard(m){
 let c=customer(m.customer);
 return `<div class="searchresult" onclick="viewMachine(${m.id})"><b>${esc(c.name)}</b><p><b>${esc(m.model)}</b> — S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><p class="small">Tap to open machine and history →</p></div>`;
}
function customerSearchResults(q){
 q=q.trim().toLowerCase();
 if(!q) return data.customers.map(customerCard).join("");
 let customerMatches=data.customers.filter(c=>c.name.toLowerCase().includes(q));
 let machineMatches=data.machines.filter(m=>{
   let c=customer(m.customer);
   return [c.name,m.model,m.serial,m.fleet].some(v=>String(v).toLowerCase().includes(q));
 });
 let seen=new Set(), html="";
 customerMatches.forEach(c=>{seen.add("c"+c.id);html+=customerCard(c)});
 machineMatches.forEach(m=>{if(!seen.has("m"+m.id)){seen.add("m"+m.id);html+=machineSearchCard(m)}});
 return html || `<p class="small">No customer or equipment found.</p>`;
}
function filterCustomers(q){custList.innerHTML=customerSearchResults(q)}
function viewCustomer(id){let c=customer(id);app.innerHTML=`<button class="btn secondary" onclick="customers()">← Customers</button><div class="card"><h2>${esc(c.name)}</h2><h3>📞 Contacts</h3>${c.contacts.map(x=>`<div class="contact"><div><b>${esc(x.name)}</b><div class="small">${esc(x.role)}<br>${esc(x.phone)}</div></div><a class="link" href="tel:${esc(x.phone)}">CALL</a></div>`).join("")}</div><div class="card"><h3>🚜 Equipment</h3>${c.machines.map(id=>machineCard(machine(id))).join("")}</div>`}
function machineCard(m){return `<div class="card" style="box-shadow:none;border:1px solid #eee" onclick="viewMachine(${m.id})"><h3>${esc(m.model)}</h3><p>S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><p class="small">${data.defects.filter(d=>d.machine==m.id).length} history records</p></div>`}
function viewMachine(id){let m=machine(id),c=customer(m.customer),ds=data.defects.filter(d=>d.machine==id);app.innerHTML=`<button class="btn secondary" onclick="viewCustomer(${c.id})">← ${esc(c.name)}</button><div class="card"><h2>${esc(m.model)}</h2><p>S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><p class="small">Current hours: ${esc(m.hours)}</p><div class="contact"><div><b>${esc(c.contacts[0].name)}</b><div class="small">${esc(c.contacts[0].role)}</div></div><a class="link" href="tel:${esc(c.contacts[0].phone)}">CALL</a></div><button class="btn primary" onclick="newDefect(${m.id})">＋ REPORT DEFECT</button></div><div class="card"><h3>📚 Defect / Job History (${ds.length})</h3><p class="small">Tap any record to view the complete defect, PDF and notes.</p>${ds.map((d,i)=>defectCard(d,i+1)).join("")}</div>`}
function defects(view){
 let open=data.defects.filter(d=>!["Completed","Customer didn't go ahead"].includes(d.status));
 let history=data.defects;
 let openSection=`<div class="card"><h2>Open Defects (${open.length})</h2>
 <p class="small">Every defect is clickable. Technicians can view status but cannot change it.</p>
 <input id="defectSearch" placeholder="Search defects..." oninput="filterDefects(this.value)">
 <div id="defectList">${open.map((d,i)=>defectCard(d,i+1)).join("")}</div></div>`;
 let historySection=`<div class="card"><h2>All Defect History (${history.length})</h2>
 <p class="small">Tap any record to view the complete defect, PDF and notes.</p>
 <div id="historyList">${history.map((d,i)=>defectCard(d,i+1)).join("")}</div></div>`;
 app.innerHTML=view==="history"?historySection+openSection:openSection+historySection;
}
function filterDefects(q){
 q=q.trim().toLowerCase();
 let open=data.defects.filter(d=>!["Completed","Customer didn't go ahead"].includes(d.status));
 let matches=open.filter(d=>{
   let m=machine(d.machine), c=customer(m.customer);
   return [d.title,d.desc,d.id,d.status,d.urgency,d.tech,m.model,m.serial,m.fleet,c.name].some(v=>String(v).toLowerCase().includes(q));
 });
 defectList.innerHTML=matches.map((d,i)=>defectCard(d,i+1)).join("") || `<p class="small">No open defects found.</p>`;
}

function newDefect(machineId){
 app.innerHTML=`<button class="btn secondary" onclick="${machineId?'viewMachine('+machineId+')':'home()'}">← Back</button>
 <div class="card"><h2>Report Defect</h2>
 <p class="small">Your draft saves automatically while you type. Submit when ready to notify the Forman.</p>
 <label><b>Search equipment</b></label>
 <p class="small">Search by customer, model, serial number (S/N) or fleet number (F/N).</p>
 <input id="equipmentSearch" placeholder="Customer, model, S/N or F/N" oninput="searchEquipment(this.value)">
 <div id="equipmentResults"></div>
 <input type="hidden" id="newMachine" value="${machineId||''}">
 <div id="selectedEquipment">${machineId?selectedEquipmentHTML(machine(machineId)):""}</div>
 <label><b>Short title</b></label><input id="title" placeholder="e.g. LH hydraulic hose leaking" oninput="saveDraftLocal()">
 <label><b>What did you find?</b></label><textarea id="desc" placeholder="Describe the defect..." oninput="saveDraftLocal()"></textarea>
 <label><b>Urgency</b></label><select id="urgency" onchange="saveDraftLocal()"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select>
 <div class="photo">📷 Add photos (prototype placeholder)</div>
 <button class="btn primary" onclick="saveDefect()">SUBMIT DEFECT — NOTIFY FORMAN</button></div>`;
 if(machineId) saveDraftLocal();
}
function saveDraftLocal(){
 let titleEl=document.getElementById("title"),descEl=document.getElementById("desc"),machineEl=document.getElementById("newMachine"),urgEl=document.getElementById("urgency");
 if(!titleEl||!descEl||!machineEl||!urgEl) return;
 let existing=drafts.find(x=>x.machine==machineEl.value && x.formOpen);
 let draft={id:existing?.id||("DRAFT-"+Date.now()),machine:machineEl.value||"",title:titleEl.value||"",desc:descEl.value||"",urgency:urgEl.value,formOpen:true};
 if(existing) Object.assign(existing,draft); else if(draft.machine||draft.title||draft.desc) drafts.unshift(draft);
}
function resumeDraft(id){
 let d=drafts.find(x=>x.id==id); if(!d){home();return;}
 newDefect(d.machine||"");
 setTimeout(()=>{
   if(document.getElementById("title")) document.getElementById("title").value=d.title||"";
   if(document.getElementById("desc")) document.getElementById("desc").value=d.desc||"";
   if(document.getElementById("urgency")) document.getElementById("urgency").value=d.urgency||"Medium";
 },0);
}
function selectedEquipmentHTML(m){
 let c=customer(m.customer);
 return `<div class="selected"><b>${esc(c.name)}</b><p><b>${esc(m.model)}</b> — S/N ${esc(m.serial)} — F/N ${esc(m.fleet)}</p><h4 style="margin:12px 0 4px">📞 Customer contacts</h4>${c.contacts.map(x=>`<div class="contact"><div><b>${esc(x.name)}</b><div class="small">${esc(x.role)}</div></div><a class="link" href="tel:${esc(x.phone)}">CALL</a></div>`).join("")}</div>`;
}
function searchEquipment(q){
 q=q.trim().toLowerCase();let box=document.getElementById("equipmentResults");if(!box)return;
 if(!q){box.innerHTML="";return;}
 let matches=data.machines.filter(m=>{let c=customer(m.customer);return [c.name,m.model,m.serial,m.fleet].some(v=>String(v).toLowerCase().includes(q));});
 box.innerHTML=matches.length?matches.map(m=>`<div class="searchresult" onclick="selectEquipment(${m.id})"><b>${esc(customer(m.customer).name)}</b><p>${esc(m.model)} — S/N ${esc(m.serial)} — F/N ${esc(m.fleet)}</p></div>`).join(""):`<p class="small">No equipment found.</p>`;
}
function selectEquipment(id){
 let m=machine(id);document.getElementById("newMachine").value=id;document.getElementById("selectedEquipment").innerHTML=selectedEquipmentHTML(m);document.getElementById("equipmentResults").innerHTML="";document.getElementById("equipmentSearch").value=""; saveDraftLocal();
}
function saveDefect(){
 if(!newMachine.value){alert("Please select the equipment first.");return;}
 let m=machine(newMachine.value);
 let d={id:"DEF-"+String(500+data.defects.length+1).padStart(5,"0"),machine:m.id,title:title.value||"Untitled defect",desc:desc.value||"",status:"New",urgency:urgency.value,tech:"Ryan",date:"12 Aug 2026",pdf:"",note:""};
 data.defects.unshift(d);
 drafts=drafts.filter(x=>!(x.machine==String(m.id) && x.formOpen));
 app.innerHTML=`<div class="card" style="text-align:center;padding:28px"><h2>✅ Defect submitted</h2><p>${esc(d.id)} has been submitted.</p><p class="small">The Forman has been notified.</p><button class="btn primary" onclick="viewDefect('${d.id}')">VIEW DEFECT</button><button class="btn secondary" onclick="home()">BACK TO HOME</button></div>`;
}
function viewDefect(id){
 let d=data.defects.find(x=>x.id==id),m=machine(d.machine),c=customer(m.customer);
 let locked=["Completed","Customer didn't go ahead"].includes(d.status);
 app.innerHTML=`<button class="btn secondary" onclick="viewMachine(${m.id})">← ${esc(m.model)} history</button>
 <div class="card"><div class="row"><h2>${esc(d.title)}</h2>${badge(d.status)}</div>
 <p>${esc(d.desc)}</p><p class="small">${esc(d.id)} • ${esc(d.date)} • Reported by ${esc(d.tech)}</p>
 <p><b>${esc(c.name)}</b><br>${esc(m.model)} • S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p>
 ${locked?`<p class="small" style="margin-top:12px">🔒 This defect is closed. Technician editing is locked.</p>`:`<button class="btn primary" onclick="editDefect('${d.id}')">✏️ EDIT / ADD TO DEFECT</button>`}</div>
 <div class="card"><h3>📌 Current Status</h3><div style="font-size:18px;font-weight:800;margin-top:8px">${badge(d.status)}</div><p class="small" style="margin-top:8px">Status is managed by the Forman.</p><p><b>Urgency:</b> ${esc(d.urgency)}</p></div>
 <div class="card"><h3>📎 Documents</h3>${locked?``:`<input type="file" accept="application/pdf" onchange="attachPDF('${d.id}',this)">`}
 <div>${d.pdf?`<div class="pdf">📄 <b>${esc(d.pdf)}</b><br><span class="small">${esc(d.note||"")}</span></div>`:`<p class="small">No PDF attached yet.</p>`}</div>
 ${locked?`<p class="small">Documents are read-only because this defect is closed.</p>`:`<input id="pdfNote" placeholder="Optional note beside PDF" value="${esc(d.note||"")}" onchange="d.note=this.value">`}</div>`;
}
function editDefect(id){
 let d=data.defects.find(x=>x.id==id);
 if(["Completed","Customer didn't go ahead"].includes(d.status)){viewDefect(id);return;}
 app.innerHTML=`<button class="btn secondary" onclick="viewDefect('${id}')">← Back to defect</button>
 <div class="card"><h2>Edit / Add to Defect</h2>
 <label><b>Short title</b></label><input id="editTitle" value="${esc(d.title)}">
 <label><b>What did you find / update?</b></label><textarea id="editDesc">${esc(d.desc)}</textarea>
 <p class="small">You can update the description as more information is found. Status and urgency remain controlled by the Forman.</p>
 <button class="btn primary" onclick="saveDefectEdit('${id}')">SAVE CHANGES</button>
 </div>
 <div class="card"><h3>📎 Add / update PDF</h3>
 <input type="file" accept="application/pdf" onchange="attachPDF('${id}',this)">
 <input id="editPdfNote" placeholder="Note beside PDF" value="${esc(d.note||"")}">
 <button class="btn secondary" onclick="savePdfNote('${id}')">SAVE PDF NOTE</button>
 ${d.pdf?`<div class="pdf">📄 Current PDF: <b>${esc(d.pdf)}</b></div>`:""}</div>`;
}
function saveDefectEdit(id){
 let d=data.defects.find(x=>x.id==id);
 if(["Completed","Customer didn't go ahead"].includes(d.status)){viewDefect(id);return;}
 d.title=editTitle.value||d.title; d.desc=editDesc.value||d.desc; viewDefect(id);
}
function savePdfNote(id){
 let d=data.defects.find(x=>x.id==id);
 if(!["Completed","Customer didn't go ahead"].includes(d.status)) d.note=editPdfNote.value||"";
 viewDefect(id);
}
function attachPDF(id,input){let d=data.defects.find(x=>x.id==id);if(["Completed","Customer didn't go ahead"].includes(d.status)){viewDefect(id);return;}if(input.files[0]){d.pdf=input.files[0].name;viewDefect(id)}}
home();
</script>
</body>
</html>
