<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>Plant Service Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827}
header{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
h1,h2,h3,p{margin:0 0 8px}.sub{color:#cbd5e1;font-size:14px}.wrap{max-width:720px;margin:auto;padding:16px 16px 90px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000b}.btn{width:100%;border:0;border-radius:13px;padding:15px 16px;font-weight:700;font-size:16px;margin:6px 0;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:14px;background:#f8fafc}.stat b{font-size:24px;display:block}.tag{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#e5e7eb;margin:3px}.open{background:#ffedd5;color:#9a3412}.done{background:#dcfce7;color:#166534}.declined{background:#e5e7eb;color:#374151}.urgent{background:#fee2e2;color:#991b1b}
input,textarea,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;margin:6px 0 12px}textarea{min-height:110px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.link{color:#2563eb;font-weight:700;cursor:pointer}.small{font-size:13px;color:#6b7280}.hidden{display:none}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;padding:8px;display:flex;justify-content:space-around;z-index:10}.nav button{background:none;border:0;font-weight:700;color:#374151}.photo{border:1px dashed #9ca3af;padding:18px;text-align:center;border-radius:12px;color:#6b7280}.timeline{border-left:3px solid #e5e7eb;padding-left:14px;margin:12px 0}.timeline div{margin-bottom:14px}.pdf{background:#f8fafc;padding:12px;border-radius:12px;margin:7px 0}.contact{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<header><h1>Plant Service</h1><div class="sub">Test prototype • Version 0.1</div></header>
<div class="wrap" id="app"></div>
<nav class="nav">
<button onclick="home()">🏠 Home</button><button onclick="customers()">👤 Customers</button><button onclick="defects()">🔧 Defects</button><button onclick="machines()">🚜 Machines</button>
</nav>
<script>
let data={
 customers:[
  {id:1,name:"ABC Civil",contacts:[{name:"John Smith",role:"Fleet Manager",phone:"+64 21 555 010"},{name:"Sarah Jones",role:"Service Manager",phone:"+64 21 555 011"}],machines:[1,2]},
  {id:2,name:"Smith Contracting",contacts:[{name:"Mike Brown",role:"Site Manager",phone:"+64 21 555 022"}],machines:[3]}
 ],
 machines:[
  {id:1,customer:1,model:"L260",serial:"4011",fleet:"50001",hours:"8,421"},
  {id:2,customer:1,model:"A40G",serial:"5120",fleet:"50022",hours:"6,210"},
  {id:3,customer:2,model:"EC750",serial:"7821",fleet:"50114",hours:"9,102"}
 ],
 defects:[
  {id:"DEF-00481",machine:1,title:"LH suspension cylinder leak",desc:"Cylinder leaking heavily. Recommend inspection and reseal.",status:"Completed",urgency:"High",tech:"Dave Smith",date:"03 Aug 2026",pdf:"Parts list.pdf",note:"Seal kit + 4 O-rings required"},
  {id:"DEF-00453",machine:1,title:"Hydraulic temperature high",desc:"Hydraulic temperature running high during heavy loading.",status:"Customer didn't go ahead",urgency:"Medium",tech:"Ryan",date:"18 Jul 2026",pdf:"Job report.pdf",note:"Customer deferred repair"},
  {id:"DEF-00502",machine:1,title:"Hydraulic hose leaking",desc:"LH hydraulic hose showing active leak.",status:"Waiting for Parts",urgency:"High",tech:"Ryan",date:"12 Aug 2026",pdf:"Parts list.pdf",note:"Hose and fittings required"},
  {id:"DEF-00420",machine:2,title:"Engine oil leak",desc:"Oil leak found around engine area.",status:"Completed",urgency:"Medium",tech:"Dave Smith",date:"21 Jun 2026",pdf:"Service report.pdf",note:"Repair completed"},
  {id:"DEF-00398",machine:3,title:"Bucket linkage wear",desc:"Excessive wear found at bucket linkage.",status:"Completed",urgency:"Low",tech:"Mike",date:"02 Jul 2026",pdf:"Inspection.pdf",note:"Bushes replaced"}
 ]
};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function customer(id){return data.customers.find(x=>x.id==id)}
function machine(id){return data.machines.find(x=>x.id==id)}
function badge(s){let c=s=="Completed"?"done":s=="Customer didn't go ahead"?"declined":s.includes("Urgent")?"urgent":"open";return `<span class="tag ${c}">${esc(s)}</span>`}
function home(){
 app.innerHTML=`<div class="card"><h2>Good afternoon</h2><p class="small">Test the technician workflow below.</p>
 <button class="btn primary" onclick="newDefect()">＋ REPORT DEFECT</button>
 <div class="grid"><div class="stat"><b>${data.defects.filter(d=>!["Completed","Customer didn't go ahead"].includes(d.status)).length}</b>Open defects</div><div class="stat"><b>${data.defects.length}</b>History records</div></div></div>
 <div class="card"><h3>Recent defects</h3>${data.defects.slice(0,3).map(d=>defectCard(d)).join("")}</div>
 <div class="card"><h3>Try the workflow</h3><p class="small">Open a machine → view history → open a defect → change status or mark it complete.</p></div>`;
}
function defectCard(d){let m=machine(d.machine);return `<div class="card" style="box-shadow:none;border:1px solid #eee" onclick="viewDefect('${d.id}')"><div class="row"><b>${esc(d.title)}</b>${badge(d.status)}</div><p class="small">${esc(m.model)} • S/N ${esc(m.serial)} • ${esc(customer(m.customer).name)}</p><p class="small">${esc(d.date)} • ${esc(d.tech)}</p></div>`}
function customers(){
 app.innerHTML=`<div class="card"><h2>Customers</h2><input placeholder="Search customers..." oninput="filterCustomers(this.value)"><div id="custList">${data.customers.map(c=>customerCard(c)).join("")}</div></div>`;
}
function customerCard(c){return `<div class="card" style="box-shadow:none;border:1px solid #eee" onclick="viewCustomer(${c.id})"><h3>${esc(c.name)}</h3><p class="small">${c.machines.length} machines • ${c.contacts.length} contacts</p></div>`}
function filterCustomers(q){custList.innerHTML=data.customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).map(customerCard).join("")}
function viewCustomer(id){let c=customer(id);app.innerHTML=`<button class="btn secondary" onclick="customers()">← Customers</button><div class="card"><h2>${esc(c.name)}</h2><h3>📞 Contacts</h3>${c.contacts.map(x=>`<div class="contact"><div><b>${esc(x.name)}</b><div class="small">${esc(x.role)}<br>${esc(x.phone)}</div></div><a class="link" href="tel:${esc(x.phone)}">CALL</a></div>`).join("")}</div><div class="card"><h3>🚜 Equipment</h3>${c.machines.map(id=>machineCard(machine(id))).join("")}</div>`}
function machineCard(m){return `<div class="card" style="box-shadow:none;border:1px solid #eee" onclick="viewMachine(${m.id})"><h3>${esc(m.model)}</h3><p>S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><p class="small">${data.defects.filter(d=>d.machine==m.id).length} history records</p></div>`}
function machines(){app.innerHTML=`<div class="card"><h2>Machines</h2><input placeholder="Search model, serial or fleet..." oninput="filterMachines(this.value)"><div id="machineList">${data.machines.map(machineCard).join("")}</div></div>`}
function filterMachines(q){machineList.innerHTML=data.machines.filter(m=>(m.model+" "+m.serial+" "+m.fleet).toLowerCase().includes(q.toLowerCase())).map(machineCard).join("")}
function viewMachine(id){let m=machine(id),c=customer(m.customer),ds=data.defects.filter(d=>d.machine==id);app.innerHTML=`<button class="btn secondary" onclick="viewCustomer(${c.id})">← ${esc(c.name)}</button><div class="card"><h2>${esc(m.model)}</h2><p>S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><p class="small">Current hours: ${esc(m.hours)}</p><button class="btn primary" onclick="newDefect(${m.id})">＋ REPORT DEFECT</button></div><div class="card"><h3>📚 Defect / Job History (${ds.length})</h3>${ds.map(defectCard).join("")}</div>`}
function defects(){app.innerHTML=`<div class="card"><h2>Defects</h2><input placeholder="Search defects..." oninput="filterDefects(this.value)"><div id="defectList">${data.defects.map(defectCard).join("")}</div></div>`}
function filterDefects(q){defectList.innerHTML=data.defects.filter(d=>(d.title+" "+d.desc+" "+d.id).toLowerCase().includes(q.toLowerCase())).map(defectCard).join("")}
function newDefect(machineId){
 app.innerHTML=`<button class="btn secondary" onclick="${machineId?'viewMachine('+machineId+')':'home()'}">← Back</button><div class="card"><h2>Report Defect</h2><label>Customer / Machine</label><select id="newMachine">${data.machines.map(m=>`<option value="${m.id}" ${m.id==machineId?'selected':''}>${esc(customer(m.customer).name)} — ${esc(m.model)} — S/N ${esc(m.serial)}</option>`).join("")}</select><label>Short title</label><input id="title" placeholder="e.g. LH hydraulic hose leaking"><label>What did you find?</label><textarea id="desc" placeholder="Describe the defect..."></textarea><label>Urgency</label><select id="urgency"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select><div class="photo">📷 Add photos (prototype placeholder)</div><button class="btn primary" onclick="saveDefect()">SUBMIT DEFECT</button></div>`;
}
function saveDefect(){let m=machine(newMachine.value);let d={id:"DEF-"+String(500+data.defects.length+1).padStart(5,"0"),machine:m.id,title:title.value||"Untitled defect",desc:desc.value||"",status:"New",urgency:urgency.value,tech:"Ryan",date:"12 Aug 2026",pdf:"",note:""};data.defects.unshift(d);viewDefect(d.id)}
function viewDefect(id){let d=data.defects.find(x=>x.id==id),m=machine(d.machine),c=customer(m.customer);app.innerHTML=`<button class="btn secondary" onclick="viewMachine(${m.id})">← ${esc(m.model)} history</button><div class="card"><div class="row"><h2>${esc(d.title)}</h2>${badge(d.status)}</div><p>${esc(d.desc)}</p><p class="small">${esc(d.id)} • ${esc(d.date)} • Reported by ${esc(d.tech)}</p><p><b>${esc(c.name)}</b><br>${esc(m.model)} • S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p></div><div class="card"><h3>📌 Status</h3><select onchange="changeStatus('${d.id}',this.value)">${["New","Urgent","Called customer","Waiting for customer approval","Waiting for Parts","Waiting for Technician","Scheduled","In progress","Completed","Customer didn't go ahead"].map(s=>`<option ${s==d.status?'selected':''}>${s}</option>`).join("")}</select>${d.status=="Completed"?`<div class="card" style="background:#f0fdf4"><b>Completed by ${esc(d.tech)}</b><p class="small">Completion is stored permanently in the machine history.</p></div>`:""}${d.status=="Customer didn't go ahead"?`<div class="card"><b>Customer didn't go ahead</b><p class="small">This record remains permanently searchable.</p></div>`:""}</div><div class="card"><h3>📎 Documents</h3><input type="file" accept="application/pdf" onchange="attachPDF('${d.id}',this)"><div id="pdfArea">${d.pdf?`<div class="pdf">📄 <b>${esc(d.pdf)}</b><br><span class="small">${esc(d.note||"")}</span></div>`:`<p class="small">No PDF attached yet.</p>`}</div><input id="pdfnote" placeholder="Optional note beside PDF" value="${esc(d.note||"")}" onchange="d.note=this.value"></div>`}
function changeStatus(id,s){let d=data.defects.find(x=>x.id==id);d.status=s;viewDefect(id)}
function attachPDF(id,input){let d=data.defects.find(x=>x.id==id);if(input.files[0]){d.pdf=input.files[0].name;viewDefect(id)}}
home();
</script>
</body>
</html>
