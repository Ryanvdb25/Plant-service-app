<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>Plant Service</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111827}
header{background:#111827;color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:5}
h1,h2,h3,h4,p{margin:0 0 8px}.sub,.small{color:#6b7280;font-size:13px}.sub{color:#cbd5e1}
.wrap{max-width:760px;margin:auto;padding:16px 16px 105px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000b}
.btn{width:100%;border:0;border-radius:13px;padding:15px 16px;font-weight:800;font-size:16px;margin:6px 0;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px;border-radius:14px;background:#f8fafc;cursor:pointer}.stat b{font-size:25px;display:block}
input,textarea,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;margin:6px 0 12px}textarea{min-height:110px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.link{color:#2563eb;font-weight:800;cursor:pointer}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#e5e7eb}.open{background:#ffedd5;color:#9a3412}.done{background:#dcfce7;color:#166534}.declined{background:#e5e7eb;color:#374151}.urgent{background:#fee2e2;color:#991b1b}
.searchresult{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:13px;margin:7px 0;cursor:pointer}.searchresult:active,.stat:active{background:#eef2ff}
.contact{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.photo-box{background:#f3f4f6;border-radius:10px;padding:14px;text-align:center;font-size:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d1d5db;padding:7px 6px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:10}
.nav button{background:none;border:0;font-weight:800;color:#374151;font-size:15px;padding:10px 18px;min-width:30%;min-height:58px}
.hidden{display:none!important}.notice{padding:12px;border-radius:12px;background:#eff6ff;margin:8px 0}.pdf{background:#f8fafc;padding:12px;border-radius:12px;margin:8px 0}
</style>
</head>
<body>
<header><h1>Plant Service</h1><div class="sub" id="roleLabel">Technician • Version 1.0</div></header>
<div class="wrap" id="app"></div>
<nav class="nav">
<button onclick="home()">🏠<br>Home</button>
<button onclick="customers()">👤<br>Customers</button>
<button onclick="defects()">🔧<br>Defects</button>
</nav>

<script>
const STORAGE="plant_service_v1";
let state={role:"Technician",drafts:[],customers:[
{id:1,name:"ABC Civil",contacts:[{name:"John Smith",role:"Fleet Manager",phone:"+6421555010"},{name:"Sarah Jones",role:"Service Manager",phone:"+6421555011"}]},
{id:2,name:"Smith Contracting",contacts:[{name:"Mike Brown",role:"Site Manager",phone:"+6421555022"}]}
],machines:[
{id:1,customer:1,model:"L260",serial:"4011",fleet:"50001",hours:"8421"},
{id:2,customer:1,model:"A40G",serial:"5120",fleet:"50022",hours:"6210"},
{id:3,customer:2,model:"EC750",serial:"7821",fleet:"50114",hours:"9102"}
],defects:[
{id:"DEF-00481",machine:1,title:"LH suspension cylinder leak",desc:"Cylinder leaking heavily. Recommend inspection and reseal.",status:"Completed",urgency:"High",tech:"Dave Smith",date:"03 Aug 2026",pdf:"Parts list.pdf",note:"Seal kit + 4 O-rings required",photos:[]},
{id:"DEF-00453",machine:1,title:"Hydraulic temperature high",desc:"Hydraulic temperature running high during heavy loading.",status:"Customer didn't go ahead",urgency:"Medium",tech:"Ryan",date:"18 Jul 2026",pdf:"Job report.pdf",note:"Customer deferred repair",photos:[]},
{id:"DEF-00502",machine:1,title:"Hydraulic hose leaking",desc:"LH hydraulic hose showing active leak.",status:"Waiting for Parts",urgency:"High",tech:"Ryan",date:"12 Aug 2026",pdf:"Parts list.pdf",note:"Hose and fittings required",photos:[]},
{id:"DEF-00420",machine:2,title:"Engine oil leak",desc:"Oil leak found around engine area.",status:"Completed",urgency:"Medium",tech:"Dave Smith",date:"21 Jun 2026",pdf:"Service report.pdf",note:"Repair completed",photos:[]},
{id:"DEF-00398",machine:3,title:"Bucket linkage wear",desc:"Excessive wear found at bucket linkage.",status:"Completed",urgency:"Low",tech:"Mike",date:"02 Jul 2026",pdf:"Inspection.pdf",note:"Bushes replaced",photos:[]}
]};

try{const saved=JSON.parse(localStorage.getItem(STORAGE)||"null");if(saved){state={...state,...saved}}}catch(e){}
function persist(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function customer(id){return state.customers.find(x=>x.id==id)}
function machine(id){return state.machines.find(x=>x.id==id)}
function defect(id){return state.defects.find(x=>x.id==id)}
function closed(d){return ["Completed","Customer didn't go ahead"].includes(d.status)}
function badge(s){let c=s=="Completed"?"done":s=="Customer didn't go ahead"?"declined":s=="Urgent"?"urgent":"open";return `<span class="tag ${c}">${esc(s)}</span>`}
function openDefects(){return state.defects.filter(d=>!closed(d))}

function home(){
const open=openDefects();
app.innerHTML=`<div class="card"><h2>Good afternoon</h2><p class="small">${esc(state.role)} view</p><button class="btn primary" onclick="newDefect()">＋ REPORT DEFECT</button>
<div class="grid"><div class="stat" onclick="defects('open')"><b>${open.length}</b>Open defects<br><span class="link">Tap to view →</span></div><div class="stat" onclick="defects('history')"><b>${state.defects.length}</b>History records<br><span class="link">Tap to view →</span></div></div></div>
${state.drafts.length?`<div class="card"><h3>📝 Draft defects</h3>${state.drafts.map(d=>`<div class="searchresult" onclick="resumeDraft('${esc(d.id)}')"><b>${esc(d.title||"Untitled defect")}</b><p class="small">${d.machine?machine(d.machine)?.model+" • S/N "+machine(d.machine)?.serial:"Equipment not selected"}</p><span class="link">Continue draft →</span></div>`).join("")}</div>`:""}
<div class="card"><h3>Recent defects</h3>${state.defects.slice(0,3).map(d=>defectCard(d)).join("")}</div>`;
}
function defectCard(d,num=""){
const m=machine(d.machine),c=customer(m.customer);
return `<div class="searchresult" onclick="viewDefect('${esc(d.id)}')"><div class="row"><b>${num?`#${num} `:""}${esc(d.title)}</b>${badge(d.status)}</div><p class="small">${esc(c.name)} • ${esc(m.model)} • S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><p class="small">${esc(d.date)} • ${esc(d.tech)}</p><span class="link">View defect →</span></div>`;
}

function customers(){
app.innerHTML=`<div class="card"><h2>Customers & Equipment</h2><p class="small">Search by customer, model, S/N or F/N.</p><input id="customerSearch" placeholder="Customer, model, S/N or F/N" oninput="filterCustomers(this.value)"><div id="customerResults">${customerSearch("")}</div></div>`;
}
function customerSearch(q){
q=q.trim().toLowerCase();
if(!q)return state.customers.map(c=>`<div class="searchresult" onclick="viewCustomer(${c.id})"><h3>${esc(c.name)}</h3><p class="small">${state.machines.filter(m=>m.customer==c.id).length} machines • ${c.contacts.length} contacts</p></div>`).join("");
let matches=state.machines.filter(m=>{let c=customer(m.customer);return [c.name,m.model,m.serial,m.fleet].some(v=>String(v).toLowerCase().includes(q))});
return matches.length?matches.map(m=>machineResult(m)).join(""):`<p class="small">No customer or equipment found.</p>`;
}
function machineResult(m){let c=customer(m.customer);let action=(typeof newMachine!=="undefined"&&document.getElementById("newMachine"))?`selectEquipment(${m.id})`:`viewMachine(${m.id})`;let label=(typeof newMachine!=="undefined"&&document.getElementById("newMachine"))?"Select equipment →":"Open machine →";return `<div class="searchresult" onclick="${action}"><b>${esc(c.name)}</b><p><b>${esc(m.model)}</b> — S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><span class="link">${label}</span></div>`}
function filterCustomers(q){customerResults.innerHTML=customerSearch(q)}

function viewCustomer(id){
let c=customer(id),ms=state.machines.filter(m=>m.customer==id);
app.innerHTML=`<button class="btn secondary" onclick="customers()">← Customers</button><div class="card"><h2>${esc(c.name)}</h2><h3>📞 Contacts</h3>${c.contacts.map(x=>`<div class="contact"><div><b>${esc(x.name)}</b><div class="small">${esc(x.role)}<br>${esc(x.phone)}</div></div><a class="link" href="tel:${esc(x.phone)}">CALL</a></div>`).join("")}</div><div class="card"><h3>🚜 Equipment</h3>${ms.map(machineResult).join("")}</div>`;
}
function viewMachine(id){
let m=machine(id),c=customer(m.customer),ds=state.defects.filter(d=>d.machine==id);
app.innerHTML=`<button class="btn secondary" onclick="viewCustomer(${c.id})">← ${esc(c.name)}</button><div class="card"><h2>${esc(m.model)}</h2><p>S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p><p class="small">Current hours: ${esc(m.hours)}</p><h4>📞 Customer contacts</h4>${c.contacts.map(x=>`<div class="contact"><div><b>${esc(x.name)}</b><div class="small">${esc(x.role)}</div></div><a class="link" href="tel:${esc(x.phone)}">CALL</a></div>`).join("")}<button class="btn primary" onclick="newDefect(${m.id})">＋ REPORT DEFECT</button></div><div class="card"><h3>📚 Defect / Job History (${ds.length})</h3>${ds.length?ds.map((d,i)=>defectCard(d,i+1)).join(""):`<p class="small">No defect history yet.</p>`}</div>`;
}

function defects(view="open"){
let open=openDefects(),history=state.defects;
app.innerHTML=`<div class="card"><h2>Defects</h2><p class="small">Universal search — customer, model, S/N, F/N, defect number, title, description, technician or status.</p><input id="defectSearch" placeholder="Search anything..." oninput="filterDefects(this.value)"><div id="defectResults"></div></div>`;
filterDefects("");
}
function searchable(d){
let m=machine(d.machine),c=customer(m.customer);
return [d.id,d.title,d.desc,d.status,d.urgency,d.tech,d.date,c.name,m.model,m.serial,m.fleet].join(" ").toLowerCase();
}
function filterDefects(q){
q=q.trim().toLowerCase();
let results=openDefects();
if(q)results=state.defects.filter(d=>searchable(d).includes(q));
else if(location.hash==="#history")results=state.defects;
defectResults.innerHTML=results.length?results.map((d,i)=>defectCard(d,i+1)).join(""):`<p class="small">No defects match “${esc(q)}”.</p>`;
}

function newDefect(machineId=""){
app.innerHTML=`<button class="btn secondary" onclick="${machineId?`viewMachine(${machineId})`:"home()"}">← Back</button><div class="card"><h2>Report Defect</h2><p class="small">Draft saves automatically. Submit to notify the Forman.</p>
<label><b>Search equipment</b></label><input id="equipmentSearch" placeholder="Customer, model, S/N or F/N" oninput="searchEquipment(this.value)"><div id="equipmentResults"></div>
<input type="hidden" id="newMachine" value="${esc(machineId)}"><div id="selectedEquipment">${machineId?selectedEquipmentHTML(machine(machineId)):""}</div>
<label><b>Short title</b></label><input id="title" placeholder="e.g. LH hydraulic hose leaking" oninput="saveDraft()">
<label><b>What did you find?</b></label><textarea id="desc" placeholder="Describe the defect..." oninput="saveDraft()"></textarea>
<label><b>Urgency</b></label><select id="urgency" onchange="saveDraft()"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select>
<button class="btn primary" onclick="submitDefect()">SUBMIT DEFECT — NOTIFY FORMAN</button></div>`;
if(machineId)saveDraft();
}
function selectedEquipmentHTML(m){
let c=customer(m.customer);
return `<div class="notice"><b>${esc(c.name)}</b><p><b>${esc(m.model)}</b> — S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p>${c.contacts.map(x=>`<div class="contact"><div><b>${esc(x.name)}</b><div class="small">${esc(x.role)}</div></div><a class="link" href="tel:${esc(x.phone)}">CALL</a></div>`).join("")}</div>`;
}
function searchEquipment(q){
q=q.trim().toLowerCase();let box=document.getElementById("equipmentResults");if(!box)return;
let ms=state.machines.filter(m=>{let c=customer(m.customer);return [c.name,m.model,m.serial,m.fleet].some(v=>String(v).toLowerCase().includes(q))});
box.innerHTML=q?(ms.length?ms.map(machineResult).join(""):`<p class="small">No equipment found.</p>`):"";
}
function selectEquipment(id){
document.getElementById("newMachine").value=id;document.getElementById("selectedEquipment").innerHTML=selectedEquipmentHTML(machine(id));document.getElementById("equipmentResults").innerHTML="";document.getElementById("equipmentSearch").value="";saveDraft();
}
function currentDraft(){
let m=document.getElementById("newMachine")?.value||"";
return {machine:m,title:document.getElementById("title")?.value||"",desc:document.getElementById("desc")?.value||"",urgency:document.getElementById("urgency")?.value||"Medium"};
}
function saveDraft(){
let d=currentDraft();if(!d.machine&&!d.title&&!d.desc)return;
let existing=state.drafts.find(x=>x.id==window.currentDraftId);
if(existing)Object.assign(existing,d);else{d.id="DRAFT-"+Date.now();window.currentDraftId=d.id;state.drafts.unshift(d)}
persist();
}
function resumeDraft(id){
let d=state.drafts.find(x=>x.id==id);if(!d)return home();
window.currentDraftId=id;newDefect(d.machine);
setTimeout(()=>{if(title)title.value=d.title;if(desc)desc.value=d.desc;if(urgency)urgency.value=d.urgency},0);
}
function submitDefect(){
let m=machine(document.getElementById("newMachine").value);
if(!m){alert("Please select the equipment first.");return}
let d={id:"DEF-"+String(500+state.defects.length+1).padStart(5,"0"),machine:m.id,title:title.value||"Untitled defect",desc:desc.value||"",status:"New",urgency:urgency.value,tech:"Ryan",date:new Date().toLocaleDateString("en-NZ",{day:"2-digit",month:"short",year:"numeric"}),pdf:"",note:"",photos:[]};
state.defects.unshift(d);state.drafts=state.drafts.filter(x=>x.id!==window.currentDraftId);window.currentDraftId=null;persist();
app.innerHTML=`<div class="card" style="text-align:center;padding:30px"><h2>✅ Defect submitted</h2><p>${esc(d.id)}</p><p class="small">The Forman has been notified.</p><button class="btn primary" onclick="viewDefect('${d.id}')">VIEW DEFECT</button><button class="btn secondary" onclick="home()">BACK TO HOME</button></div>`;
}

function viewDefect(id){
let d=defect(id),m=machine(d.machine),c=customer(m.customer),isClosed=closed(d);
app.innerHTML=`<button class="btn secondary" onclick="viewMachine(${m.id})">← ${esc(m.model)} history</button><div class="card"><div class="row"><h2>${esc(d.title)}</h2>${badge(d.status)}</div><p>${esc(d.desc)}</p><p class="small">${esc(d.id)} • ${esc(d.date)} • Reported by ${esc(d.tech)}</p><p><b>${esc(c.name)}</b><br>${esc(m.model)} • S/N ${esc(m.serial)} • F/N ${esc(m.fleet)}</p>${isClosed?`<div class="notice">🔒 Closed record — technician editing is locked.</div>`:`<button class="btn primary" onclick="editDefect('${d.id}')">✏️ EDIT / ADD INFORMATION</button>`}</div>
<div class="card"><h3>📌 Status</h3>${badge(d.status)}<p class="small">Status and urgency are managed by the Forman.</p><p><b>Urgency:</b> ${esc(d.urgency)}</p></div>
<div class="card"><h3>📎 PDF</h3>${isClosed?"":`<input type="file" accept="application/pdf" onchange="attachPDF('${d.id}',this)">`}${d.pdf?`<div class="pdf">📄 <b>${esc(d.pdf)}</b><br><span class="small">${esc(d.note||"")}</span></div>`:`<p class="small">No PDF attached.</p>`}${isClosed?"":`<input id="noteField" placeholder="Note beside PDF" value="${esc(d.note||"")}" onchange="saveNote('${d.id}',this.value)">`}</div>
<div class="card"><h3>📷 Photos (${d.photos.length})</h3>${isClosed?`<p class="small">Photos are read-only because the defect is closed.</p>`:`<label class="btn secondary" style="display:block;text-align:center">📷 Take new photo<input class="hidden" type="file" accept="image/*" capture="environment" onchange="addPhotos('${d.id}',this)"></label><label class="btn secondary" style="display:block;text-align:center">🖼️ Choose from camera roll<input class="hidden" type="file" accept="image/*" multiple onchange="addPhotos('${d.id}',this)"></label>`}<div class="photo-grid">${d.photos.map(p=>`<div class="photo-box">📷<br>${esc(p)}</div>`).join("")}</div></div>`;
}
function editDefect(id){
let d=defect(id);if(closed(d))return viewDefect(id);
app.innerHTML=`<button class="btn secondary" onclick="viewDefect('${id}')">← Back</button><div class="card"><h2>Edit / Add Information</h2><label><b>Title</b></label><input id="editTitle" value="${esc(d.title)}"><label><b>Description / updates</b></label><textarea id="editDesc">${esc(d.desc)}</textarea><p class="small">Status and urgency remain controlled by the Forman.</p><button class="btn primary" onclick="saveEdit('${id}')">SAVE CHANGES</button></div>`;
}
function saveEdit(id){let d=defect(id);if(closed(d))return viewDefect(id);d.title=editTitle.value||d.title;d.desc=editDesc.value||d.desc;persist();viewDefect(id)}
function saveNote(id,value){let d=defect(id);if(!closed(d)){d.note=value;persist()}}
function attachPDF(id,input){let d=defect(id);if(closed(d))return;if(input.files[0]){d.pdf=input.files[0].name;persist();viewDefect(id)}}
function addPhotos(id,input){let d=defect(id);if(closed(d))return;[...input.files].forEach(f=>d.photos.push(f.name));persist();viewDefect(id)}

home();
</script>
</body>
</html>
