<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Service Test</title>
<style>
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}
header{background:#111827;color:white;padding:20px 16px}
main{max-width:700px;margin:auto;padding:16px 16px 90px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
.result{padding:14px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0;cursor:pointer}
.result:active{background:#eef2ff}.small{font-size:13px;color:#6b7280}.back{border:0;background:#e5e7eb;padding:10px 14px;border-radius:10px;font-weight:bold}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around}
nav button{border:0;background:white;padding:16px;font-weight:bold;font-size:15px}
.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#ffedd5;color:#9a3412;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<header><h1>Plant Service</h1><div class="small" style="color:#cbd5e1">Clean test version</div></header>
<main id="app"></main>
<nav><button onclick="home()">🏠 Home</button><button onclick="customers()">👤 Customers</button><button onclick="defects()">🔧 Defects</button></nav>
<script>
const customersData=[
 {id:1,name:"ABC Civil",contacts:["John Smith"]},
 {id:2,name:"Smith Contracting",contacts:["Mike Brown"]}
];
const machines=[
 {id:1,customer:1,model:"L260",serial:"4011",fleet:"50001"},
 {id:2,customer:1,model:"A40G",serial:"5120",fleet:"50022"},
 {id:3,customer:2,model:"EC750",serial:"7821",fleet:"50114"}
];
const defectsData=[
 {id:"DEF-001",machine:1,title:"Hydraulic hose leaking",status:"Waiting for Parts"},
 {id:"DEF-002",machine:1,title:"Engine oil leak",status:"Completed"},
 {id:"DEF-003",machine:3,title:"Bucket linkage wear",status:"Completed"},
 {id:"DEF-004",machine:3,title:"Hydraulic pressure low",status:"New"}
];

function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function customer(id){return customersData.find(function(c){return c.id===id})}
function machine(id){return machines.find(function(m){return m.id===id})}

function home(){
 app.innerHTML='<div class="card"><h2>Welcome</h2><p>This is the clean test version.</p><p class="small">If you can see this screen, GitHub Pages and the app code are working.</p></div>'+
 '<div class="card"><h3>Test equipment</h3>'+machines.map(machineCard).join("")+'</div>';
}
function machineCard(m){
 let c=customer(m.customer);
 return '<div class="result" onclick="viewMachine('+m.id+')"><b>'+esc(c.name)+'</b><br>'+esc(m.model)+' • S/N '+esc(m.serial)+' • F/N '+esc(m.fleet)+'</div>';
}
function customers(){
 app.innerHTML='<div class="card"><h2>Customers & Equipment</h2><p class="small">Search customer, model, S/N or F/N.</p><input id="customerSearch" placeholder="Try EC750, 4011, 50001 or ABC Civil" oninput="filterCustomers(this.value)"><div id="customerResults">'+machines.map(machineCard).join("")+'</div></div>';
}
function filterCustomers(q){
 q=q.toLowerCase().trim();
 let results=machines.filter(function(m){
  let c=customer(m.customer);
  return [c.name,m.model,m.serial,m.fleet].join(" ").toLowerCase().includes(q);
 });
 customerResults.innerHTML=results.length?results.map(machineCard).join(""):'<p class="small">No results.</p>';
}
function viewMachine(id){
 let m=machine(id),c=customer(m.customer);
 let ds=defectsData.filter(function(d){return d.machine===id});
 app.innerHTML='<button class="back" onclick="customers()">← Back</button><div class="card"><h2>'+esc(m.model)+'</h2><p>'+esc(c.name)+'</p><p>S/N '+esc(m.serial)+' • F/N '+esc(m.fleet)+'</p></div><div class="card"><h3>Defect History ('+ds.length+')</h3>'+ds.map(defectCard).join("")+'</div>';
}
function defectCard(d){
 let m=machine(d.machine),c=customer(m.customer);
 return '<div class="result" onclick="viewDefect(\''+d.id+'\')"><b>'+esc(d.title)+'</b> <span class="tag">'+esc(d.status)+'</span><p class="small">'+esc(c.name)+' • '+esc(m.model)+' • S/N '+esc(m.serial)+' • F/N '+esc(m.fleet)+'</p></div>';
}
function defects(){
 app.innerHTML='<div class="card"><h2>Defects</h2><p class="small">Universal search. Only matching defects will be shown.</p><input id="defectSearch" placeholder="Try EC750, 7821, 50114, DEF-003 or linkage" oninput="filterDefects(this.value)"><div id="defectResults">'+defectsData.map(defectCard).join("")+'</div></div>';
}
function filterDefects(q){
 q=q.toLowerCase().trim();
 let results=defectsData.filter(function(d){
  let m=machine(d.machine),c=customer(m.customer);
  return [d.id,d.title,d.status,c.name,m.model,m.serial,m.fleet].join(" ").toLowerCase().includes(q);
 });
 defectResults.innerHTML=results.length?results.map(defectCard).join(""):'<p class="small">No matching defects.</p>';
}
function viewDefect(id){
 let d=defectsData.find(function(x){return x.id===id}),m=machine(d.machine),c=customer(m.customer);
 app.innerHTML='<button class="back" onclick="defects()">← Back to defects</button><div class="card"><h2>'+esc(d.title)+'</h2><p><b>'+esc(d.status)+'</b></p><p>'+esc(c.name)+' • '+esc(m.model)+'</p><p>S/N '+esc(m.serial)+' • F/N '+esc(m.fleet)+'</p><p class="small">'+esc(d.id)+'</p></div>';
}
home();
</script>
</body>
</html>
